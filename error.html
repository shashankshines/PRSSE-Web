          // Scroll reveal animation observer
          (function initScrollReveal() {
            const isMobile = window.innerWidth <= 767;
            const observerOptions = {
              threshold: isMobile ? 0.05 : 0.15,
              rootMargin: isMobile ? '0px 0px 0px 0px' : '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  entry.target.classList.add('revealed');
                  observer.unobserve(entry.target);
                }
              });
            }, observerOptions);

            const sections = document.querySelectorAll(
              '.error_section, ' +
              '.error_section .container, ' +
              '.error_section .error_title, ' +
              '.error_section .error_description, ' +
              '.error_section .form_item, ' +
              '.error_section .deco_item'
            );

            const sectionsArray = Array.from(sections);
            sectionsArray.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);

            sectionsArray.forEach((section, index) => {
              section.classList.add('scroll-reveal');
              const delayClass = 'delay-' + ((index % 3) + 1);
              section.classList.add(delayClass);
              observer.observe(section);
            });

            if (isMobile) {
              setTimeout(function() {
                const hiddenElements = document.querySelectorAll('.scroll-reveal:not(.revealed)');
                hiddenElements.forEach(el => {
                  const rect = el.getBoundingClientRect();
                  if (rect.top < window.innerHeight) {
                    el.classList.add('revealed');
                  }
                });
              }, 500);
            }
          })();
</script></body>
